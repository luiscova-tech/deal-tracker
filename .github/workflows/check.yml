name: Check for new deals

on:
  schedule:
    # Dense: every 5 min, 4:00-5:30 AM UTC (9:00-10:30 PM Arizona time,
    # fixed year-round since Arizona doesn't observe DST). Split across two
    # lines since the window ends mid-hour at 5:30, not 5:55.
    - cron: "*/5 4 * * *"
    - cron: "0,5,10,15,20,25,30 5 * * *"
    # Sparse: once per hour the rest of the day, as a safety net. Excludes
    # hours 4-5 so it doesn't double up with the dense schedule above.
    - cron: "0 0-3,6-23 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run deal check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NELLIS_SHOPPING_LOCATION_COOKIE: ${{ secrets.NELLIS_SHOPPING_LOCATION_COOKIE }}
        run: python main.py
